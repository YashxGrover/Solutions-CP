name: Classify Codeforces solutions by day

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: codeforces-daily-index
  cancel-in-progress: false

jobs:
  build-daily-index:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependency
        run: python -m pip install requests

      - name: Generate daily date-folder classification
        env:
          CF_HANDLE: ${{ vars.CF_HANDLE }}
        run: python .github/scripts/classify_codeforces_by_day.py

      - name: Commit date-folder copies
        run: |
          if git diff --quiet -- Codeforces/; then
            echo "Codeforces date folders are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A Codeforces/
          git commit -m "Classify Codeforces solutions by submission date"
          git push
