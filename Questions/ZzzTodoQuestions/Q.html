<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Codeforces Tracker – Topics & Judgments</title>
<style>
:root {
  --bg: #fff;
  --fg: #1a1a1a;
  --mut: #666;
  --card: #f4f4f5;
  --bd: #ddd;
  --ac: #2563eb;
  --tag: #e0e7ff;
  --tag-fg: #3730a3;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111;
    --fg: #eee;
    --mut: #999;
    --card: #1c1c1e;
    --bd: #333;
    --ac: #6ea0ff;
    --tag: #1e293b;
    --tag-fg: #93c5fd;
  }
}
:root[data-theme="dark"] {
  --bg: #111;
  --fg: #eee;
  --mut: #999;
  --card: #1c1c1e;
  --bd: #333;
  --ac: #6ea0ff;
  --tag: #1e293b;
  --tag-fg: #93c5fd;
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 15px/1.45 system-ui, sans-serif;
}
main {
  max-width: 820px;
  margin: 0 auto;
  padding: 16px;
}
h1 {
  font-size: 22px;
  margin: 0 0 4px;
}
.sub {
  color: var(--mut);
  margin-bottom: 14px;
}
.bar {
  height: 8px;
  background: var(--card);
  border-radius: 4px;
  overflow: hidden;
  margin-bottom: 16px;
}
.bar div {
  height: 100%;
  background: var(--ac);
  width: 0;
  transition: width 0.3s ease;
}
.row {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-start;
  gap: 8px 12px;
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 10px;
  padding: 12px 14px;
  margin-bottom: 8px;
}
.row input {
  width: 20px;
  height: 20px;
  flex: none;
  margin-top: 2px;
}
.row a {
  color: var(--ac);
  text-decoration: none;
  font-weight: 600;
  font-size: 16px;
}
.row.done {
  opacity: 0.55;
}
.row.done a {
  text-decoration: line-through;
}
.meta {
  margin-left: auto;
  text-align: right;
  color: var(--mut);
  font-size: 13px;
  min-width: 70px;
}
.tags {
  width: 100%;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 2px;
  padding-left: 32px;
}
.tag {
  background: var(--tag);
  color: var(--tag-fg);
  font-size: 12px;
  padding: 3px 8px;
  border-radius: 999px;
  font-weight: 500;
}
.note {
  width: 100%;
  padding-left: 32px;
  font-size: 13px;
  color: var(--mut);
  margin-top: 2px;
}
h3.blk {
  font-size: 16px;
  margin: 22px 0 8px;
  padding-bottom: 4px;
  border-bottom: 2px solid var(--ac);
}
h2 {
  font-size: 15px;
  color: var(--mut);
  margin: 22px 0 10px;
}
button {
  background: var(--card);
  color: var(--fg);
  border: 1px solid var(--bd);
  border-radius: 6px;
  padding: 7px 12px;
  cursor: pointer;
  font-size: 14px;
}
button:hover {
  border-color: var(--ac);
}
.legend {
  font-size: 13px;
  color: var(--mut);
  margin-bottom: 16px;
  line-height: 1.5;
}
</style>
</head>
<body>
<main>
  <h1>Codeforces Tracker – Topics & Judgments</h1>
  <div class="sub" id="sub"></div>
  <div class="bar"><div id="p"></div></div>
  <div class="legend">
    Topics are based on official Codeforces tags + analysis of constraints & required techniques.<br>
    Common tags: <b>brute force</b>, <b>math</b>, <b>implementation</b>, <b>greedy</b>, <b>strings</b>, <b>number theory</b>, etc.
  </div>
  <div id="todo"></div>
  <h2 id="dh">Completed</h2>
  <div id="done"></div>
  <p style="margin-top:20px"><button id="rs">Reset all progress</button></p>
</main>

<script>
const Q = [
  {id:"266A", rating:800, url:"https://codeforces.com/problemset/problem/266/A", note:"student extra", topics:["implementation"]},
  {id:"339A", rating:800, url:"https://codeforces.com/problemset/problem/339/A", note:"student extra", topics:["implementation","sortings","strings"]},
  {id:"486A", rating:800, url:"https://codeforces.com/problemset/problem/486/A", note:"", date:"13 Sep", topics:["implementation","math"]},
  {id:"617A", rating:800, url:"https://codeforces.com/problemset/problem/617/A", note:"", date:"13 Sep", topics:["math"]},
  {id:"732A", rating:800, url:"https://codeforces.com/problemset/problem/732/A", note:"", date:"17 Sep", topics:["brute force","constructive algorithms","implementation","math"]},
  {id:"1352A", rating:800, url:"https://codeforces.com/problemset/problem/1352/A", note:"", date:"21 Sep", topics:["implementation","math"]},
  {id:"1367B", rating:800, url:"https://codeforces.com/problemset/problem/1367/B", note:"", date:"24 Sep", topics:["greedy","math"]},
  {id:"1374A", rating:800, url:"https://codeforces.com/problemset/problem/1374/A", note:"", topics:["math"]},
  {id:"1462A", rating:800, url:"https://codeforces.com/problemset/problem/1462/A", note:"", date:"22 Sep", topics:["implementation","two pointers"]},
  {id:"1725A", rating:800, url:"https://codeforces.com/problemset/problem/1725/A", note:"", date:"11 Sep", topics:["math"]},
  {id:"1806A", rating:800, url:"https://codeforces.com/problemset/problem/1806/A", note:"", date:"14 Sep", topics:["geometry","greedy","math"]},
  {id:"1837A", rating:800, url:"https://codeforces.com/problemset/problem/1837/A", note:"", date:"20 Sep", topics:["math","constructive algorithms"]},
  {id:"1858A", rating:800, url:"https://codeforces.com/problemset/problem/1858/A", note:"", date:"20 Sep", topics:["games","greedy","math"]},
  {id:"1899A", rating:800, url:"https://codeforces.com/problemset/problem/1899/A", note:"", date:"14 Sep", topics:["math","games"]},
  {id:"1900A", rating:800, url:"https://codeforces.com/problemset/problem/1900/A", note:"student extra", topics:["constructive algorithms","greedy"]},
  {id:"1901A", rating:800, url:"https://codeforces.com/problemset/problem/1901/A", note:"", topics:["greedy","math"]},
  {id:"2009A", rating:800, url:"https://codeforces.com/problemset/problem/2009/A", note:"student extra", topics:["math"]},
  {id:"2014B", rating:800, url:"https://codeforces.com/problemset/problem/2014/B", note:"", date:"12 Sep", topics:["math","greedy"]},
  {id:"2070A", rating:800, url:"https://codeforces.com/problemset/problem/2070/A", note:"student extra", topics:["math","implementation"]},
  {id:"2133A", rating:800, url:"https://codeforces.com/problemset/problem/2133/A", note:"student extra", topics:["implementation","math"]},
  {id:"2147A", rating:800, url:"https://codeforces.com/problemset/problem/2147/A", note:"", date:"21 Sep", topics:["math"]},
  {id:"2148B", rating:800, url:"https://codeforces.com/problemset/problem/2148/B", note:"", date:"18 Sep", topics:["implementation","math"]},
  {id:"2156A", rating:800, url:"https://codeforces.com/problemset/problem/2156/A", note:"", date:"16 Sep", topics:["math","implementation"]},
  {id:"2193B", rating:800, url:"https://codeforces.com/problemset/problem/2193/B", note:"", topics:["greedy","implementation"]},
  {id:"2203A", rating:800, url:"https://codeforces.com/problemset/problem/2203/A", note:"", date:"19 Sep", topics:["implementation","math"]},
  {id:"2217A", rating:800, url:"https://codeforces.com/problemset/problem/2217/A", note:"", date:"23 Sep", topics:["math","implementation"]},
  {id:"2257B", rating:800, url:"https://codeforces.com/problemset/problem/2257/B", note:"", date:"22 Sep", topics:["implementation","greedy"]},
  {id:"2266A", rating:800, url:"https://codeforces.com/problemset/problem/2266/A", note:"", date:"25 Sep", topics:["implementation","math"]},
  {id:"616A", rating:900, url:"https://codeforces.com/problemset/problem/616/A", note:"", date:"17 Sep", topics:["implementation","strings"]},
  {id:"514A", rating:1200, url:"https://codeforces.com/problemset/problem/514/A", note:"", date:"17 Sep", topics:["greedy","implementation"]},
  {id:"2131A", rating:"Unrated", url:"https://codeforces.com/problemset/problem/2131/A", note:"", date:"24 Sep", topics:["implementation","math"]},
  {id:"2140B", rating:"Unrated", url:"https://codeforces.com/problemset/problem/2140/B", note:"", date:"18 Sep", topics:["implementation","math"]},
  {id:"2155A", rating:"Unrated", url:"https://codeforces.com/problemset/problem/2155/A", note:"", date:"15 Sep", topics:["implementation","math"]},
  {id:"2180A", rating:"Unrated", url:"https://codeforces.com/problemset/problem/2180/A", note:"", date:"16 Sep", topics:["implementation","math"]},
  {id:"2218B", rating:"Unrated", url:"https://codeforces.com/problemset/problem/2218/B", note:"", date:"19 Sep", topics:["implementation","greedy"]},
  {id:"2253A", rating:"Unrated", url:"https://codeforces.com/problemset/problem/2253/A", note:"Unrated (failed earlier)", date:"11 Sep", topics:["implementation","math"]},
  {id:"2267B", rating:"Unrated", url:"https://codeforces.com/problemset/problem/2267/B", note:"", topics:["implementation","math"]},
  {id:"219774L", rating:"Unrated", url:"https://codeforces.com/group/MWSDmqGsZm/contest/219774/problem/L", note:"", date:"23 Sep", topics:["implementation","math"]}
];

let S = {};
try {
  S = JSON.parse(localStorage.getItem("cf_done_topics") || "{}");
} catch (e) {}

function save() {
  try {
    localStorage.setItem("cf_done_topics", JSON.stringify(S));
  } catch (e) {}
}

function row(q) {
  const d = document.createElement("div");
  d.className = "row" + (S[q.id] ? " done" : "");

  const c = document.createElement("input");
  c.type = "checkbox";
  c.checked = !!S[q.id];
  c.onchange = () => {
    if (c.checked) S[q.id] = 1;
    else delete S[q.id];
    save();
    render();
  };

  const a = document.createElement("a");
  a.href = q.url;
  a.target = "_blank";
  a.rel = "noopener";
  a.textContent = q.id;

  const meta = document.createElement("div");
  meta.className = "meta";
  meta.innerHTML = (q.rating + "") + (q.date ? "<br><small>POTD " + q.date + "</small>" : "") + (q.note ? "<br><small>" + q.note + "</small>" : "");

  d.append(c, a, meta);

  // Topics
  if (q.topics && q.topics.length) {
    const tagsDiv = document.createElement("div");
    tagsDiv.className = "tags";
    q.topics.forEach(t => {
      const span = document.createElement("span");
      span.className = "tag";
      span.textContent = t;
      tagsDiv.appendChild(span);
    });
    d.appendChild(tagsDiv);
  }

  return d;
}

function render() {
  const t = document.getElementById("todo");
  const dn = document.getElementById("done");
  t.innerHTML = "";
  dn.innerHTML = "";
  let n = 0;
  const last = {todo: null, done: null};
  Q.forEach(q => {
    const k = S[q.id] ? "done" : "todo";
    const host = S[q.id] ? dn : t;
    if (last[k] !== q.rating) {
      last[k] = q.rating;
      const h = document.createElement("h3");
      h.className = "blk";
      h.textContent = q.rating === "Unrated" ? "Unrated" : q.rating + " rating";
      host.appendChild(h);
    }
    host.appendChild(row(q));
    if (S[q.id]) n++;
  });
  document.getElementById("sub").textContent = n + " of " + Q.length + " done";
  document.getElementById("p").style.width = (100 * n / Q.length) + "%";
  document.getElementById("dh").style.display = n ? "" : "none";
}

document.getElementById("rs").onclick = () => {
  if (confirm("Clear all progress?")) {
    S = {};
    save();
    render();
  }
};

render();
</script>
</body>
</html>
